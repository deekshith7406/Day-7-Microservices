server.port=8081
spring.application.name=USER-SERVICE

# Day 6: register with the Eureka discovery server so other services (and
# the API Gateway) can find this instance by name instead of by fixed address.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Day 7: which environment's configuration to load. Switch at startup
# without touching this file, e.g.:
#   mvn spring-boot:run -Dspring-boot.run.arguments=--spring.profiles.active=test
spring.profiles.active=dev

# Day 7: fetch app.message / app.timeout / app.environment from Config
# Server instead of defining them here. "optional:" means this service
# still starts even if Config Server is unreachable (see Hands-on
# Challenge 3 in README.md for what that looks like and why it's the
# deliberate choice here, not a mandatory "configserver:").
spring.config.import=optional:configserver:http://localhost:8888
