server.port=8082
spring.application.name=ORDER-SERVICE

# Day 6: register with the Eureka discovery server as ORDER-SERVICE, so the
# API Gateway can route /orders/** to this instance by name.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Day 7: which environment's configuration to load.
#   mvn spring-boot:run -Dspring-boot.run.arguments=--spring.profiles.active=test
spring.profiles.active=dev

# Day 7: fetch app.message / app.environment / user.service.base-url from
# Config Server. Note what's GONE from this file compared to Day 6:
# user.service.base-url used to be defined right here (Section 11's
# externalization exercise). It's now defined in
# config-repo/ORDER-SERVICE.properties instead — this is Hands-on
# Challenge 1, "move a real setting out of code [...] such as a service
# URL." RestClientConfig.java's @Value("${user.service.base-url}") did not
# change at all; only where the value comes from changed.
#
# "optional:" means this service won't refuse to start just because
# Config Server happens to be down — but see README.md's Challenge 3
# section for an important nuance: that does NOT automatically make
# app.message/user.service.base-url themselves optional. If Config Server
# really is unreachable and nothing local defines those properties, this
# service will still fail to start — on purpose, so you can observe and
# reason about exactly that distinction.
spring.config.import=optional:configserver:http://localhost:8888
