spring.application.name=CONFIG-SERVER
server.port=8888

# The handbook's own example uses an absolute file:// path. This uses a
# relative one instead, resolved against the working directory the server
# is started from (config-server/), so this project runs the same on any
# machine after unzipping without anyone needing to edit an absolute path
# first. Run it as `cd config-server && mvn spring-boot:run` and this
# resolves to the config-repo/ folder that's a sibling of config-server/.
#
# If you move config-server elsewhere, or run it from a different working
# directory, change this to an absolute file:// path instead, e.g.:
#   spring.cloud.config.server.git.uri=file:///home/you/day5-7-service-platform/config-repo
spring.cloud.config.server.git.uri=file:../config-repo
